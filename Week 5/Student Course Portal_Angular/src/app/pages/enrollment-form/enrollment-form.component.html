<section class="enrollment-page">
  <h2>Enrollment Request (Template-Driven Form)</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input
        id="studentName"
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        #nameCtrl="ngModel"
        required
        minlength="3"
      />
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required.</span>
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
    </div>

    <div class="field">
      <label for="studentEmail">Email</label>
      <input
        id="studentEmail"
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        #emailCtrl="ngModel"
        required
        email
      />
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required.</span>
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email address.</span>
    </div>

    <div class="field">
      <label for="courseId">Course ID</label>
      <input
        id="courseId"
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        #courseCtrl="ngModel"
        required
      />
      <span class="error" *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">Course ID is required.</span>
    </div>

    <div class="field">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" name="preferredSemester" [(ngModel)]="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox-field">
      <label>
        <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required />
        I agree to the enrollment terms
      </label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" (click)="onReset(enrollForm)">Reset</button>
    </div>

    <p class="success" *ngIf="submitted">Enrollment request submitted successfully!</p>
  </form>
</section>
